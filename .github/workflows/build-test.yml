name: Desktop verification

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: desktop-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IS_CI: 'true'
      LUX_EVIDENCE_DIR: artifacts/screenshots
      LUX_EVIDENCE_MODE: themes
      LUX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LUX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install isolated window manager and Chinese fonts
        timeout-minutes: 7
        shell: bash
        run: |
          packages=()
          for package in xvfb xauth fonts-noto-cjk xfwm4 xdotool x11-utils dbus-bin dbus-daemon; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              packages+=("$package")
            fi
          done
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y "${packages[@]}"
          fi
          command -v xvfb-run xfwm4 xdotool xprop dbus-run-session dbus-update-activation-environment
          fc-match ':lang=zh' --format '%{family}\n'

      - name: Lint, typecheck, test and build all application targets
        run: npm run verify

      - name: Prepare reviewed Electron runtime and SQLite binding
        run: npm run evidence:prepare

      - name: Capture actual Electron application
        run: npm run evidence

      - name: Verify real local media controls
        env:
          LUX_EVIDENCE_MODE: media
          LUX_EVIDENCE_DIR: artifacts/media
        run: npm run evidence

      - name: Verify real playback queue and magazine panel
        env:
          LUX_EVIDENCE_MODE: queue
          LUX_EVIDENCE_DIR: artifacts/queue
        run: npm run evidence

      - name: Verify original native window controls and fullscreen
        env:
          LUX_EVIDENCE_MODE: window
          LUX_EVIDENCE_DIR: artifacts/window
        run: npm run evidence

      - name: Verify actual native window drag
        env:
          LUX_EVIDENCE_MODE: native-drag
          LUX_EVIDENCE_DIR: artifacts/native-drag
        run: npm run evidence

      - name: Verify original settings entries and capture magazine groups
        env:
          LUX_EVIDENCE_MODE: settings
          LUX_EVIDENCE_DIR: artifacts/settings
          LUX_EVIDENCE_SIZES: 1280x800,1024x700,1440x900
        run: npm run evidence

      - name: Verify download states, column alignment and original controls
        env:
          LUX_EVIDENCE_MODE: downloads
          LUX_EVIDENCE_DIR: artifacts/downloads
        run: npm run evidence

      - name: Verify search behaviors in actual Electron
        env:
          LUX_EVIDENCE_MODE: search
          LUX_EVIDENCE_DIR: artifacts/search
        run: npm run evidence

      - name: Upload verification logs, build and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/
            dist/
          if-no-files-found: error
          retention-days: 90
